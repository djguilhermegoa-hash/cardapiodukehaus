<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Cardápio | Duke Haus</title>
  <style>
    :root{--ink:#050505;--paper:#f0eee8;--acid:#c7ff00;--logo:none}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}button{font:inherit}
    .shell{position:relative;width:100%;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;background:radial-gradient(circle at 80% 8%,rgba(199,255,0,.13),transparent 25%),#050505;border-inline:1px solid #1a1a1a}
    .noise{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
    .brand{position:relative;z-index:2;height:118px;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #30302d;background:rgba(5,5,5,.91);backdrop-filter:blur(16px)}
    .brand>img{width:62px;height:62px;object-fit:cover;border:1px solid #292929;filter:contrast(1.15)}
    .brand-copy p,.section-title p,.intro p,.item-copy p,.rail-label{margin:0;color:var(--acid);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .brand-copy h1{margin:1px 0 0;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(34px,11vw,54px);font-weight:900;line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
    .live{align-self:start;display:flex;align-items:center;gap:5px;margin-top:5px;color:#aaa;font:700 8px/1 monospace;letter-spacing:.12em;text-transform:uppercase}.live i{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 12px var(--acid)}
    .promo-banner{position:relative;z-index:3;height:78px;display:grid;grid-template-columns:1fr;align-items:center;padding:12px 14px 10px;color:#050505;background:var(--acid);overflow:hidden;text-align:center}
    .promo-banner:after{position:absolute;inset:0;content:"";pointer-events:none;opacity:.15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .promo-tag{position:absolute;top:4px;left:14px;font:900 7px/1 monospace;letter-spacing:.22em;text-transform:uppercase}.promo-offer{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:5px}.promo-offer strong{font-family:"Arial Narrow",Arial,sans-serif;font-size:12px;font-weight:900;line-height:1.02;text-transform:uppercase}.promo-offer b{font-family:Impact,"Arial Narrow",sans-serif;font-size:25px;font-weight:900;line-height:1;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}
    .menu-layout{height:calc(100dvh - 196px);display:grid;grid-template-columns:96px minmax(0,1fr)}
    .category-rail{position:relative;z-index:2;min-height:0;overflow:hidden;padding:15px 8px 18px;border-right:1px solid #30302d;background:#090909}.rail-label{padding:0 7px 11px;color:#666;font-size:7px}.rail-line{height:1px;margin:0 7px 11px;background:#272727}
    .category-rail button{position:relative;width:100%;min-height:58px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:9px 7px;color:#73736e;background:transparent;border:0;border-bottom:1px solid #1d1d1b;text-align:left;font-size:10px;font-weight:800;line-height:1.1;text-transform:uppercase;transition:color .18s ease,padding .18s ease;cursor:pointer}.category-rail button span{color:#444;font:700 8px/1 monospace}.category-rail button.active{padding-left:15px;color:var(--paper)}.category-rail button.active:before{position:absolute;left:2px;width:5px;height:30px;content:"";background:var(--acid);box-shadow:0 0 16px rgba(199,255,0,.6)}.category-rail button.active span{color:var(--acid)}.rail-mark{position:absolute;bottom:11px;left:26px;width:44px;height:44px;object-fit:cover;opacity:.25}
    .products{min-width:0;overflow-x:hidden;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--acid) #101010}.intro{min-height:95px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 18px 18px;border-bottom:1px solid #202020}.intro p{color:#90908a;font-size:8px}.intro span{margin-top:7px;color:var(--paper);font-family:Georgia,serif;font-size:15px;font-style:italic}
    .category-section{scroll-margin-top:0;padding:26px 14px 32px;border-bottom:1px solid #262623;background:linear-gradient(160deg,rgba(255,255,255,.025),transparent 38%)}.section-title{display:grid;grid-template-columns:41px 1fr;align-items:start;gap:9px;margin-bottom:18px}.section-title>span{color:var(--acid);font:700 11px/1 monospace}.section-title p{margin-bottom:3px;color:#6f6f6a;font-size:7px}.section-title h2{max-width:280px;margin:0;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(30px,9.5vw,47px);font-weight:900;line-height:.88;letter-spacing:-.015em;text-transform:uppercase}
    .item-list{position:relative}.item-list:after{position:absolute;right:10px;bottom:0;z-index:0;width:110px;height:110px;content:"";background:var(--logo) center/contain no-repeat;opacity:.035;pointer-events:none}.menu-item{position:relative;z-index:1;min-height:68px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;border-top:1px solid #2d2d29}.menu-item:last-child{border-bottom:1px solid #2d2d29}.item-index{color:#4d4d48;font:700 8px/1 monospace}.item-copy{min-width:0;padding:10px 0}.item-copy h3{margin:0;color:var(--paper);font-family:"Arial Narrow",Arial,sans-serif;font-size:14px;font-weight:800;line-height:1.08;text-transform:uppercase}.item-copy p{margin-top:5px;overflow:hidden;color:#575752;font-size:6px;white-space:nowrap;text-overflow:ellipsis}.menu-item>strong{align-self:stretch;min-width:59px;display:grid;place-items:center;padding-left:8px;color:var(--acid);border-left:1px solid #2d2d29;font:800 13px/1 "Arial Narrow",Arial,sans-serif;white-space:nowrap}
    footer{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 18px 50px;text-align:center}footer img{width:118px;height:118px;object-fit:cover}footer p{margin:13px 0 5px;font-family:Georgia,serif;font-size:17px;font-style:italic}footer span{color:#555;font:700 7px/1.4 monospace;letter-spacing:.12em;text-transform:uppercase}
    @media(max-height:650px){.brand{height:96px}.promo-banner{height:68px;padding-block:8px 6px}.promo-offer b{font-size:21px}.menu-layout{height:calc(100dvh - 164px)}.category-rail button{min-height:51px}.rail-mark{display:none}}
    @media(min-width:561px){body{background:linear-gradient(rgba(0,0,0,.86),rgba(0,0,0,.86)),var(--logo) center/440px repeat}.shell{box-shadow:0 0 80px rgba(0,0,0,.95)}}
    @media(prefers-reduced-motion:reduce){.products{scroll-behavior:auto}}
  </style>
</head>

    buttons.innerHTML=menu.map((c,i)=>`<button type="button" data-target="${c.id}" class="${i===0?'active':''}"><span>${c.code}</span>${c.short}</button>`).join("");
    sections.innerHTML=menu.map(c=>`<article class="category-section" id="${c.id}"><header class="section-title"><span>${c.code}</span><div><p>Duke selection</p><h2>${c.name}</h2></div></header><div class="item-list">${c.items.map(([name,price],i)=>`<div class="menu-item"><div class="item-index">${String(i+1).padStart(2,"0")}</div><div class="item-copy"><h3>${name}</h3><p>DUKE HAUS · ${c.short.toUpperCase()}</p></div><strong>${money(price)}</strong></div>`).join("")}</div></article>`).join("");
    const setActive=id=>document.querySelectorAll("[data-target]").forEach(b=>b.classList.toggle("active",b.dataset.target===id));
    buttons.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.getElementById(b.dataset.target).scrollIntoView({behavior:"smooth",block:"start"});setActive(b.dataset.target)});
    const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible)setActive(visible.target.id)},{root:products,rootMargin:"-12% 0px -68% 0px",threshold:[0,.1,.4]});
    menu.forEach(c=>observer.observe(document.getElementById(c.id)));
  </script>
</body>
</html>
