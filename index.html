<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Duke Haus — Cardápio</title>
  <style>
    :root{--ink:#050505;--paper:#f0eee8;--acid:#c7ff00;--line:#292929}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}.shell{position:relative;width:100%;height:100dvh;max-width:560px;margin:auto;overflow:hidden;background:radial-gradient(circle at 80% 8%,#c7ff0021,transparent 25%),var(--ink);border-inline:1px solid #1a1a1a}.brand{height:118px;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #30302d}.logo{display:grid;width:62px;height:62px;place-items:center;border:1px solid var(--line);background:var(--acid);color:#050505;font-family:Impact,"Arial Narrow",sans-serif;font-size:20px;font-style:italic;line-height:.75;text-align:center}.eyebrow,.section-title p,.item-copy p,.rail-label{margin:0;color:var(--acid);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.brand h1{margin:2px 0 0;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(34px,11vw,54px);line-height:.9;text-transform:uppercase}.live{align-self:start;margin-top:5px;color:#aaa;font:700 8px/1 monospace;letter-spacing:.12em;text-transform:uppercase}.live::before{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--acid);box-shadow:0 0 12px var(--acid);content:""}.promo{height:78px;display:grid;grid-template-columns:1fr 1px 1.65fr;gap:10px;align-items:center;padding:12px 14px 10px;color:#050505;background:var(--acid)}.offer{display:flex;min-width:0;flex-direction:column;gap:2px}.offer strong{font:900 12px/1.02 "Arial Narrow",Arial,sans-serif;text-transform:uppercase}.offer b{font:900 22px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:-.02em;white-space:nowrap}.divider{height:44px;background:#05050570}.layout{height:calc(100dvh - 196px);display:grid;grid-template-columns:96px minmax(0,1fr)}nav{min-height:0;overflow:hidden;padding:15px 8px;border-right:1px solid #30302d;background:#090909}.rail-label{padding:0 7px 11px;color:#666;font-size:7px}nav button{position:relative;width:100%;min-height:58px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:9px 7px;color:#73736e;background:transparent;border:0;border-bottom:1px solid #1d1d1b;text-align:left;font-size:10px;font-weight:800;line-height:1.1;text-transform:uppercase;cursor:pointer}nav button span{color:#444;font:700 8px/1 monospace}nav button.active{padding-left:15px;color:var(--paper)}nav button.active::before{position:absolute;left:2px;width:5px;height:30px;background:var(--acid);box-shadow:0 0 16px #c7ff0099;content:""}nav button.active span{color:var(--acid)}.products{min-width:0;overflow-y:auto;scroll-behavior:smooth;scrollbar-color:var(--acid) #101010}.intro{min-height:95px;display:flex;flex-direction:column;justify-content:end;padding:24px 18px 18px;border-bottom:1px solid #202020}.intro p{margin:0;color:#90908a;font-size:8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.intro span{margin-top:7px;font:italic 15px Georgia,serif}.category{padding:26px 14px 32px;border-bottom:1px solid #262623;background:linear-gradient(160deg,#ffffff06,transparent 38%)}.section-title{display:grid;grid-template-columns:41px 1fr;gap:9px;margin-bottom:18px}.section-title>span{color:var(--acid);font:700 11px/1 monospace}.section-title h2{margin:3px 0 0;font:900 27px/.95 Impact,"Arial Narrow",sans-serif;letter-spacing:-.02em;text-transform:uppercase}.item{display:grid;grid-template-columns:29px 1fr auto;gap:8px;align-items:center;min-height:62px;border-top:1px solid #292927}.item-index{color:#555;font:700 9px/1 monospace}.item h3{margin:0;font-size:13px;line-height:1.1;text-transform:uppercase}.item-copy p{margin-top:5px;color:#777;font-size:7px}.item strong{color:var(--acid);font:900 16px/1 Impact,"Arial Narrow",sans-serif;white-space:nowrap}footer{padding:32px 14px 50px;text-align:center}footer .logo{width:48px;height:48px;margin:auto;font-size:15px;opacity:.55}footer p{margin:14px 0 5px;font:italic 16px Georgia,serif}footer span{color:#777;font-size:9px;text-transform:uppercase}@media(max-width:360px){.offer b{font-size:18px}.promo{gap:7px;padding-inline:10px}.layout{grid-template-columns:84px minmax(0,1fr)}nav{padding-inline:5px}.section-title h2{font-size:24px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand"><div class="logo">DUKE<br>HAUS</div><div><p class="eyebrow">Haus menu · 2026</p><h1>Cardápio</h1></div><span class="live">open</span></header>
    <section class="promo"><div class="offer"><strong>Amstel 350ml</strong><b>R$ 9,00</b></div><div class="divider"></div><div class="offer"><strong>Vodka com energético<br>ou Gin Tropical</strong><b>2 por R$ 30,00</b></div></section>
    <div class="layout"><nav id="nav" aria-label="Categorias"><p class="rail-label">categorias</p></nav><section class="products" id="products"><div class="intro"><p>Escolha sua frequência</p><span>Role para explorar ↓</span></div><div id="menu"></div><footer><div class="logo">DUKE<br>HAUS</div><p>Dance first. Think later.</p><span>Preços sujeitos a alteração.</span></footer></section></div>
  </main>
  <script>
    const menu=[
      ['cervejas','Cervejas','Cervejas e Bebidas','01',[['Heineken Long Neck',14],['Budweiser',13],['Amstel Long Neck',11],['Beats lata',17]]],
      ['drinks','Drinks','Drinks','02',[['Vodka Com Energetico',20],['Smirnorf Com Energetico',22],['Caipirinha',20],['Sex on the beach',22],['Dukezza',25],['Cosmopolitan',25],['Diablo Azul',25],['Gin Tropical',25],['Gin Tropical com Red Bull',35],['Gin Melancia',25],['Gin Fizz',30],['Gin Tônica',25],['Gin Limão Siciliano',25]]],
      ['sem-alcool','Sem álcool','Bebidas sem álcool','03',[['Suco lata',8],['Refri lata',8],['H2OH Limoneto',10],['Red Bull',20],['Água sem gás',7],['Agua tonica',8],['Água com gás',8]]],
      ['doses','Doses','Doses','04',[['Smirnoff',15],['Gin Seagers',15],['Whisky Red Label',25],['Campari',20]]],
      ['combos','Combos','Combos','05',[['Smirnoff com 4 Red Bulls',200],['Absolut com 4 Red Bulls',280],['Tanqueray com 4 Red Bulls',280],['Gin Seagers com 4 Red Bulls',220],['Red Label com 4 Red Bulls',240],['Old Par com 4 Red Bulls',380]]],
      ['outros','Outros','Outros','06',[['Cigarro',2],['Freegels',3],['Pirulito',1],['Gelo Extra Combo',6],['Copo Gelo',2]]]
    ];
    const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0});
    const nav=document.querySelector('#nav'), mount=document.querySelector('#menu'), products=document.querySelector('#products');
    menu.forEach(([id,short,name,code,items],i)=>{const b=document.createElement('button');b.innerHTML=`<span>${code}</span>${short}`;b.className=i?'':'active';b.onclick=()=>document.querySelector('#'+id).scrollIntoView({behavior:'smooth',block:'start'});nav.append(b);const article=document.createElement('article');article.className='category';article.id=id;article.innerHTML=`<header class="section-title"><span>${code}</span><div><p>Duke selection</p><h2>${name}</h2></div></header>`+items.map(([n,p],x)=>`<div class="item"><div class="item-index">${String(x+1).padStart(2,'0')}</div><div class="item-copy"><h3>${n}</h3><p>DUKE HAUS · ${short.toUpperCase()}</p></div><strong>${brl(p)}</strong></div>`).join('');mount.append(article)});
    const buttons=[...nav.querySelectorAll('button')];new IntersectionObserver(es=>{const e=es.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(e)buttons.forEach((b,i)=>b.classList.toggle('active',menu[i][0]===e.target.id))},{root:products,rootMargin:'-12% 0px -68% 0px',threshold:[0,.1,.4]}).observe(document.querySelector('#cervejas'));
    [...mount.children].slice(1).forEach(x=>new IntersectionObserver(es=>{const e=es.find(y=>y.isIntersecting);if(e)buttons.forEach((b,i)=>b.classList.toggle('active',menu[i][0]===e.target.id))},{root:products,rootMargin:'-12% 0px -68% 0px',threshold:[0,.1,.4]}).observe(x));
  </script>
</body>
</html>
