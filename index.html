<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Cardápio | Duke Haus</title>
  <meta name="description" content="Cardápio oficial da Duke Haus.">
  <style>
    :root{--ink:#050505;--paper:#f0eee8;--acid:#c7ff00}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}
    button{font:inherit}
    .shell{position:relative;width:100%;height:100dvh;max-width:560px;margin:auto;overflow:hidden;background:radial-gradient(circle at 80% 8%,rgba(199,255,0,.13),transparent 25%),#050505;border-inline:1px solid #1a1a1a}
    .noise{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
    .brand{position:relative;z-index:2;height:118px;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #30302d;background:rgba(5,5,5,.91);backdrop-filter:blur(16px)}
    .brand>img{width:62px;height:62px;object-fit:cover;border:1px solid #292929;filter:contrast(1.15)}
    .brand p,.section-title p,.intro p,.item-copy p,.rail-label{margin:0;color:var(--acid);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .brand h1{margin:1px 0 0;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(34px,11vw,54px);line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
    .live{align-self:start;display:flex;align-items:center;gap:5px;margin-top:5px;color:#aaa;font:700 8px/1 monospace;letter-spacing:.12em;text-transform:uppercase}
    .live i{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 12px var(--acid)}
    .promo-banner{position:relative;z-index:3;height:78px;display:grid;grid-template-columns:1fr 1px 1.65fr;align-items:center;gap:10px;padding:12px 14px 10px;color:#050505;background:var(--acid);overflow:hidden}
    .promo-banner:after{position:absolute;inset:0;content:"";pointer-events:none;opacity:.15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .promo-tag{position:absolute;top:4px;left:14px;font:900 7px/1 monospace;letter-spacing:.22em;text-transform:uppercase}.promo-offer{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:5px}.promo-offer strong{font-family:"Arial Narrow",Arial,sans-serif;font-size:12px;font-weight:900;line-height:1.02;text-transform:uppercase}.promo-offer b{font-family:Impact,"Arial Narrow",sans-serif;font-size:25px;line-height:1;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}.promo-offer-wide b{font-size:20px}.promo-divider{position:relative;z-index:1;width:1px;height:44px;background:rgba(5,5,5,.42)}
    .menu-layout{height:calc(100dvh - 196px);display:grid;grid-template-columns:96px minmax(0,1fr)}
    .category-rail{position:relative;z-index:2;min-height:0;overflow:hidden;padding:15px 8px 18px;border-right:1px solid #30302d;background:#090909}
    .rail-label{padding:0 7px 11px;color:#666;font-size:7px}
    .rail-line{height:1px;margin:0 7px 11px;background:#272727}
    .category-rail button{position:relative;width:100%;min-height:58px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:9px 7px;color:#73736e;background:transparent;border:0;border-bottom:1px solid #1d1d1b;text-align:left;font-size:10px;font-weight:800;line-height:1.1;text-transform:uppercase;transition:.18s;cursor:pointer}
    .category-rail button span{color:#444;font:700 8px/1 monospace}
    .category-rail button.active{padding-left:15px;color:var(--paper)}
    .category-rail button.active:before{position:absolute;left:2px;width:5px;height:30px;content:"";background:var(--acid);box-shadow:0 0 16px rgba(199,255,0,.6)}
    .category-rail button.active span{color:var(--acid)}
    .rail-mark{position:absolute;bottom:11px;left:26px;width:44px;height:44px;object-fit:cover;opacity:.25}
    .products{min-width:0;overflow-x:hidden;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--acid) #101010}
    .intro{min-height:95px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 18px 18px;border-bottom:1px solid #202020}
    .intro p{color:#90908a;font-size:8px}.intro span{margin-top:7px;font-family:Georgia,serif;font-size:15px;font-style:italic}
    .category-section{padding:26px 14px 32px;border-bottom:1px solid #262623;background:linear-gradient(160deg,rgba(255,255,255,.025),transparent 38%)}
    .section-title{display:grid;grid-template-columns:41px 1fr;align-items:start;gap:9px;margin-bottom:18px}
    .section-title>span{color:var(--acid);font:700 11px/1 monospace}.section-title p{margin-bottom:3px;color:#6f6f6a;font-size:7px}
    .section-title h2{max-width:280px;margin:0;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(30px,9.5vw,47px);line-height:.88;letter-spacing:-.015em;text-transform:uppercase}
    .item-list{position:relative}
    .item-list:after{position:absolute;right:10px;bottom:0;z-index:0;width:110px;height:110px;content:"";background:url("https://duke-haus-cardapio.djguilhermegoa.chatgpt.site/duke-logo.png") center/contain no-repeat;opacity:.035;pointer-events:none}
    .menu-item{position:relative;z-index:1;min-height:68px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;border-top:1px solid #2d2d29}
    .menu-item:last-child{border-bottom:1px solid #2d2d29}.item-index{color:#4d4d48;font:700 8px/1 monospace}.item-copy{min-width:0;padding:10px 0}
    .item-copy h3{margin:0;font-family:"Arial Narrow",Arial,sans-serif;font-size:14px;font-weight:800;line-height:1.08;text-transform:uppercase}
    .item-copy p{margin-top:5px;overflow:hidden;color:#575752;font-size:6px;white-space:nowrap;text-overflow:ellipsis}
    .menu-item strong{align-self:stretch;min-width:59px;display:grid;place-items:center;padding-left:8px;color:var(--acid);border-left:1px solid #2d2d29;font:800 13px/1 "Arial Narrow",Arial,sans-serif;white-space:nowrap}
    footer{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 18px 50px;text-align:center}
    footer img{width:118px;height:118px;object-fit:cover}footer p{margin:13px 0 5px;font-family:Georgia,serif;font-size:17px;font-style:italic}footer span{color:#555;font:700 7px/1.4 monospace;letter-spacing:.12em;text-transform:uppercase}
    @media(max-height:650px){.brand{height:96px}.promo-banner{height:68px;padding-block:8px 6px}.promo-offer b{font-size:21px}.promo-offer-wide b{font-size:17px}.menu-layout{height:calc(100dvh - 164px)}.category-rail button{min-height:51px}.rail-mark{display:none}}
    @media(min-width:561px){body{background:#0b0b0b}.shell{box-shadow:0 0 80px rgba(0,0,0,.95)}}
    @media(prefers-reduced-motion:reduce){.products{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="noise" aria-hidden="true"></div>
    <header class="brand">
      <img src="https://duke-haus-cardapio.djguilhermegoa.chatgpt.site/duke-logo.png" alt="Duke Haus">
      <div><p>Haus menu · 2026</p><h1>Cardápio</h1></div>
      <span class="live"><i></i> open</span>
    </header>
    <section class="promo-banner" aria-label="Promoções">
      <span class="promo-tag">promo</span>
      <div class="promo-offer"><strong>Amstel 350ml</strong><b>R$ 9,00</b></div>
      <div class="promo-divider" aria-hidden="true"></div>
      <div class="promo-offer promo-offer-wide"><strong>Vodka com energético<br>ou Gin Tropical</strong><b>2 por R$ 30,00</b></div>
    </section>
    <div class="menu-layout">
      <nav class="category-rail" aria-label="Categorias do cardápio">
        <p class="rail-label">categorias</p><div class="rail-line"></div>
        <div id="nav"></div>
        <img class="rail-mark" src="https://duke-haus-cardapio.djguilhermegoa.chatgpt.site/duke-logo.png" alt="">
      </nav>
      <section class="products" id="products" aria-label="Produtos">
        <div class="intro"><p>Escolha sua frequência</p><span>Role para explorar ↓</span></div>
        <div id="menu"></div>
        <footer>
          <img src="https://duke-haus-cardapio.djguilhermegoa.chatgpt.site/duke-logo.png" alt="Duke Haus">
          <p>Dance first. Think later.</p><span>Preços sujeitos a alteração.</span>
        </footer>
      </section>
    </div>
  </main>
  <script>
    const categories=[
      {id:"cervejas",short:"Cervejas",name:"Cervejas e Bebidas",items:[["Heineken Long Neck",14],["Budweiser",13],["Amstel Long Neck",11],["Beats lata",17],["Veneta Lata",18],["Veneta Chopp",17],["Xeque Mate lata",18],["Amstel Vibes",16]]},
      {id:"drinks",short:"Drinks",name:"Drinks",items:[["Vodka Com Energetico",20],["Smirnorf Com Energetico",22],["Caipirinha",20],["Sex on the beach",22],["Dukezza",25],["Cosmopolitan",25],["Diablo Azul",25],["Veludo Royale",25],["Gin Tropical",25],["Gin Tropical com Red Bull",35],["Gin Melancia",25],["Gin Fizz",30],["Gin Tônica",25],["Gin Limão Siciliano",25]]},
      {id:"sem-alcool",short:"Sem álcool",name:"Bebidas sem álcool",items:[["Suco lata",8],["Refri lata",8],["H2OH Limoneto",10],["Red Bull",20],["Água sem gás",7],["Agua tonica",8],["Água com gás",8]]},
      {id:"doses",short:"Doses",name:"Doses",items:[["Smirnoff",15],["Gin Seagers",15],["Whisky Red Label",25],["Campari",20]]},
      {id:"combos",short:"Combos",name:"Combos",items:[["Smirnoff com 4 Red Bulls",200],["Absolut com 4 Red Bulls",280],["Tanqueray com 4 Red Bulls",280],["Gin Seagers com 4 Red Bulls",220],["Red Label com 4 Red Bulls",240],["Old Par com 4 Red Bulls",380]]},
      {id:"outros",short:"Outros",name:"Outros",items:[["Cigarro",2],["Freegels",3],["Pirulito",1],["Gelo Extra Combo",6],["Copo Gelo",2]]}
    ].map((c,i)=>({...c,code:String(i+1).padStart(2,"0")}));
    const price=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:0});
    const nav=document.querySelector("#nav");
    const menu=document.querySelector("#menu");
    nav.innerHTML=categories.map((c,i)=>`<button data-id="${c.id}" class="${i===0?"active":""}"><span>${c.code}</span>${c.short}</button>`).join("");
    menu.innerHTML=categories.map(c=>`<article class="category-section" id="${c.id}">
      <header class="section-title"><span>${c.code}</span><div><p>Duke selection</p><h2>${c.name}</h2></div></header>
      <div class="item-list">${c.items.map(([name,value],i)=>`<div class="menu-item"><div class="item-index">${String(i+1).padStart(2,"0")}</div><div class="item-copy"><h3>${name}</h3><p>DUKE HAUS · ${c.short.toUpperCase()}</p></div><strong>${price.format(value)}</strong></div>`).join("")}</div>
    </article>`).join("");
    const scroller=document.querySelector("#products");
    nav.addEventListener("click",event=>{
      const button=event.target.closest("button");if(!button)return;
      document.getElementById(button.dataset.id).scrollIntoView({behavior:"smooth",block:"start"});
      nav.querySelectorAll("button").forEach(item=>item.classList.toggle("active",item===button));
    });
    const observer=new IntersectionObserver(entries=>{
      const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(visible)nav.querySelectorAll("button").forEach(button=>button.classList.toggle("active",button.dataset.id===visible.target.id));
    },{root:scroller,rootMargin:"-12% 0px -68% 0px",threshold:[0,.1,.4]});
    categories.forEach(c=>observer.observe(document.getElementById(c.id)));
  </script>
</body>
</html>
